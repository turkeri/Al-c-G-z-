name = "arac-dedektifi-ai"
main = "worker.js"
compatibility_date = "2024-11-01"

# Araç veritabanı (Cloudflare D1).
# database_id'yi şu komut verir:  npx wrangler d1 create arac-dedektifi
# Bağlanmazsa uygulama gömülü veriyle çalışmaya devam eder, hiçbir şey bozulmaz.
[[d1_databases]]
binding = "DB"
database_name = "arac-dedektifi"
database_id = "BURAYA_D1_DATABASE_ID"

# Model tercihi (ücretsiz katmanda çalışan bir model seçin)
[vars]
# GEMINI_MODEL = "gemini-2.5-flash"   # bos birakilirsa calisan model otomatik bulunur

# Sadece kendi uygulamanızın çağırmasını isterseniz burayı doldurun.
# Boş bırakılırsa tüm kaynaklara izin verilir (geliştirme için pratik, yayında daraltın).
# ALLOWED_ORIGINS = "https://uygulamaniz.com,capacitor://localhost"

# GEMINI_API_KEY buraya YAZILMAZ. Şu komutla gizli olarak eklenir:
#   npx wrangler secret put GEMINI_API_KEY

# Hız limiti istiyorsanız bir KV namespace oluşturup aşağıyı açın:
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "buraya_kv_namespace_id"
