<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Araç Dedektifi — Veri Yükleyici</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f3f5fa; color: #101828;
      }
      .card {
        max-width: 620px; margin: 0 auto; background: #fff;
        border: 1px solid rgba(16,24,40,.09); border-radius: 18px;
        padding: 22px; box-shadow: 0 8px 20px rgba(16,24,40,.06);
      }
      h1 { font-size: 1.25rem; margin: 0 0 6px; }
      p.sub { margin: 0 0 18px; color: #5b6472; font-size: .9rem; line-height: 1.5; }
      label { display: block; font-size: .8rem; font-weight: 600; color: #5b6472; margin: 14px 0 6px; }
      input {
        width: 100%; padding: 11px 12px; font-size: .95rem; font-family: inherit;
        background: #f6f8fc; border: 1px solid rgba(16,24,40,.09); border-radius: 8px; color: #101828;
      }
      button {
        width: 100%; margin-top: 18px; padding: 14px; font-size: 1rem; font-weight: 700;
        font-family: inherit; color: #fff; background: #3454d1; border: none; border-radius: 12px; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      .log {
        margin-top: 16px; padding: 12px; border-radius: 10px; background: #f6f8fc;
        border: 1px solid rgba(16,24,40,.09); font-size: .82rem; line-height: 1.6;
        max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word;
      }
      .bar { height: 8px; background: #eceff5; border-radius: 999px; overflow: hidden; margin-top: 14px; }
      .bar > span { display: block; height: 100%; width: 0; background: #3454d1; transition: width .2s; }
      .ok { color: #15803d; font-weight: 700; }
      .err { color: #b91c1c; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Veri Yükleyici</h1>
      <p class="sub">
        <code>src/data/vehicles.json</code> dosyasındaki araç kayıtlarını Cloudflare D1
        veritabanına yükler. Komut satırına gerek yoktur; bu sayfayı uygulamanın içinden
        (Spck önizlemesiyle) açman yeterlidir.
      </p>

      <label for="url">Worker adresi</label>
      <input id="url" type="url" placeholder="https://arac-dedektifi-ai.xxx.workers.dev"
             value="https://arac-dedektifi-ai.turkerinurullah.workers.dev" />

      <label for="token">Yönetici anahtarı (ADMIN_TOKEN)</label>
      <input id="token" type="password" placeholder="wrangler secret put ADMIN_TOKEN ile belirlediğin değer" />

      <label for="revision">Revizyon numarası</label>
      <input id="revision" type="number" min="1" value="1" />

      <button id="start">Veriyi Yükle</button>

      <div class="bar"><span id="bar"></span></div>
      <div class="log" id="log">Hazır.</div>
    </div>

    <script type="module">
      const BATCH = 40

      const $ = (id) => document.getElementById(id)
      const logBox = $('log')
      const bar = $('bar')

      function log(message, cls) {
        const line = document.createElement('div')
        if (cls) line.className = cls
        line.textContent = message
        logBox.appendChild(line)
        logBox.scrollTop = logBox.scrollHeight
      }

      $('start').addEventListener('click', async () => {
        const base = $('url').value.trim().replace(/\/+$/, '')
        const token = $('token').value.trim()
        const revision = Number($('revision').value) || 1

        if (!base || !token) {
          log('Worker adresi ve yönetici anahtarı gerekli.', 'err')
          return
        }

        $('start').disabled = true
        logBox.textContent = ''

        try {
          log('Veri dosyası okunuyor...')
          const response = await fetch('../../src/data/vehicles.json')
          if (!response.ok) throw new Error('vehicles.json okunamadı (HTTP ' + response.status + ')')
          const vehicles = await response.json()
          log(vehicles.length + ' kayıt bulundu.')

          const total = Math.ceil(vehicles.length / BATCH)

          for (let i = 0; i < vehicles.length; i += BATCH) {
            const chunk = vehicles.slice(i, i + BATCH)
            const index = Math.floor(i / BATCH) + 1

            const res = await fetch(base + '/data/import', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token,
                revision,
                vehicles: chunk,
                // İlk parçada tablo temizlenir, son parçada revizyon damgalanır.
                reset: i === 0,
                final: i + BATCH >= vehicles.length
              })
            })

            const data = await res.json().catch(() => ({}))
            if (!res.ok) throw new Error('Parça ' + index + ': ' + (data.error || res.status))

            log('Parça ' + index + '/' + total + ' yüklendi — sunucudaki toplam: ' + data.total)
            bar.style.width = Math.round((index / total) * 100) + '%'
          }

          log('Tamamlandı. Doğrulamak için: ' + base + '/data/version', 'ok')
        } catch (err) {
          log('Hata: ' + err.message, 'err')
        } finally {
          $('start').disabled = false
        }
      })
    </script>
  </body>
</html>
